  subtitle: Oracle India Inc. (Hackathon)
  tags: Pupil Detection, Support Vector Machines, Kalman Filter, Python, OpenCV, scikit-learn, pandas
  highlights: The aim of the project was to generate heatmap by tracking user&rsquo;s gaze on screen. We implemented gaze tracking system by implementing pupil capturing using eye center localization as proposed by Timm F. and Erhardt B. in their paper <em>Accurate Eye Centre Localisation by Means of Gradients</em> <em>VISAPP 11 (2011)</em> and later trained SVM model to track user&rsquo;s gaze on screen. The output by SVM model was wavy and to get a smoother distribution, we later added unimodal probability distribution obtained by Kalman Filter.
  link:

- id: Extraction_of_Biomedical_Implant
  title: Extraction of Biomedical Implant
  subtitle: GlobalLogic India Pvt. Ltd.
  tags: Biomedical Imaging, Image Processing, Pattern Matching, Morphological Transformations, MATLAB, OpenCV, Android SDK
  highlights: At GlobalLogic, I worked for one of the top-3 medical technological conglomerates in the world, and worked on the development of image processing pipeline for extraction of the biomedical implant from the x-ray. The task was preceded by denoising image using a median filter, and improving contrast in an image by applying adaptive histogram equalization. The denoised-contrast-enhanced image was then passed to morphological filters to find possible candidates for the implant, and finally, the candidates were narrowed down using pattern matching (on image descriptors). The final decision still to select the position of implant still lied with the operator. The prototyping of the approach was done using MATLAB, and the code was later ported to Android.
  link:

- id: Geocleansing_of_Location_Data
  title: Geocleansing of Location Data
  subtitle: Oracle India Inc. (Hackathon)
  tags: Natural Language Processing, Phonetic Algorithm, Soundex, Fuzzy Logic, PLSQL
  highlights: The project aimed at cleansing massive geographical datasets to get rid of typographical errors and duplicate records. I initially found similar records by using <em>Levenshtein Distance</em> as similarity matrix, however, this led to a high number of false positives (about 30% of predicted duplicates). To tighten the false positives, I later implemented fuzzy logic using <em>Levenshtein Distance</em>, <em>Soundex</em>, and <em>New York State Identification and Intelligence System</em>. The accuracy of the model was further enhanced by imposing hierarchy constraints on locations (e.g. only cities in same states would be considered for matching, and the states should have been already cleaned before proceeding with cities). The precision for the tool was <strong>88%</strong>, with a miss of <strong>4%</strong>.
  link:

