- id: Predict__Predicting_Users_for_Advertising_
  title: Predict (Predicting Users for Advertising)
  subtitle: Media IQ Digital India Ltd.
  tags: Machine Learning, Big Data, Naïve Bayes, Random Forest, K-Means Clustering, Behavioral Targeting, Hive, Spark MLlib, Spark Streaming, Kafka
  highlights: The project aims at predicting users who would take desirable action after an advertisement is displayed to them, and target them in real time. The previous model was powered by <em>Naives Bayes Classifier</em> built by aggregating user&rsquo;s browsing behavior and geolocation. We migrated the model to <em>Random Forest</em> which provided about 10% uplift in the preliminary analysis. To combat memory issues stemming out of the large feature set while using <em>Random Forest</em>, we grouped the features by <em>K-Means</em> <em>Clustering</em> and used aggregated count of the group to train the model. Moving forward we would be incorporating temporal behavior in the model&rsquo;s feature set, and move to real-time prediction using Spark Streaming.
  link:

- id: Realtime_Reactor_Control_Simulator
  title: Realtime Reactor Control Simulator
  subtitle: Under Guidance of Dr. A. Tiwari, B.A.R.C., Mumbai
  tags: Numerical Techniques, Euler’s Method, Ruge-Kutta Method, Control Systems, MATLAB, LabVIEW, NI PCI-6031e
  highlights: The project aimed at stimulating dynamics of a nuclear reactor in real-time. To simulate the behavior of reactor, we solved <em>Point Kinetic Equation</em> using <em>Runge-Kutta Method</em> (which was selected after benchmarking it against other numerical techniques like <em>Euler Method</em> and <em>Newton-Rhapson Method</em> with an aim to optimize speed for bigger step sizes). We then designed feedback system by formulating the relationship between error and gain value, obtained by plotting optimum gain values vs. equilibrium power, and thus, empowered the system to take a decision based on a mathematical model. The system UI was built using LabVIEW and the data acquisition was done using NI PCI-6031e.
  link:

