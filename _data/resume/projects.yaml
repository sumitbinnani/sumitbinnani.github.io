- id: Analyzing_Social_Network
  title: Analyzing Social Network
  subtitle: Self-Motivated Project
  tags: Visualization, Mathematical Modelling, Social Network, Graphs, WebCrawler, Python, Selenium, PhantomJS, d3.j
  highlights: The aim of the project was to visualize my social network, and find clusters on basis of connections. To accomplished the task, I wrote a python based web crawler using PhantomJS and Selenium to crawl friends&rsquo; list on Facebook (as Graph API restricts a number of results substantially). The data so obtained was then used to draw a graph by modeling people as charges and connection between them as spring. The modeling of charge and spring brought together the clusters which were closely connected and thus provided clusters without any other attributes. The clusters obtained once the people (charges) are similar despite their random initialization. Closely looking at the clusters, we find that there are clusters within clusters. Also, the people lying between two clusters are usually common to both of the clusters.
  link: https://sumitbinnani.github.io/fb-social-network/index.html

- id: Predictive_Client_side_Profiling_for_Behavioral_Advertising
  title: Predictive Client-side Profiling for Behavioral Advertising
  subtitle: Media IQ Digital India Ltd.
  tags: Real-time Prediction, Machine Learning, Client-side Profiling, Behavioral Targeting, Ad-exchange Architecture, JavaScript, HTML, Python, Kafka, NLP
  highlights:  <strong>The methodology is currently under scrutiny for patent application</strong>. The idea was harnessed as part of a Hackathon at Media IQ Digital India Ltd. Leveraging know-how of Web Development and Data Science, I proposed a novel scalable approach for client-side user profiling to offer personalized advertising experience. The proposed methodology&rsquo;s merit includes near-real-time user profiling, high scalability, low-bandwidth requirement, privacy issues redressal, and minimal changes to existing ad-exchange architecture. The scalability and privacy issue are addressed by avoiding server-side data aggregation, which in turn also reduces server&rsquo;s storage and computational requirements. The approach can be easily integrated with existing ad-exchange platforms, and bid optimization frameworks, allowing advertisers highly-granular ad personalization without significant infrastructure investments
  link:

- id: Electronics_Aid_for_elder_and_Sick
  title: Electronics Aid for elder and Sick
  subtitle: Under Guidance of Dr. Hari Om Bansal, BITS Pilani
  tags: Embedded System, Assistive Aid, Microcontroller Programming, Wireless Switches, IR Reciever, C, Arduino, Sensor Interfacing
  highlights: The project started as a development of <em>Smart Home </em>module, and later got focused on the development of wireless switches as an aid for elderly and sick people. The choice of infra-red for wireless communication was to avoid interference with other medical devices in hospitals. The task was accomplished by using decoding IR Signal from TV-remote controller and triggering relays to operate electrical appliances. Since the frequency at which the IR Signals are emitted from the remote controller is high, the input from IR receiver was read using a lower level of abstractions. The control signals from the remote were easy to identify as the remote controller had a distinctive start and end sequence. The work done was published in<em> IEEE Conference Proceeding of Recent Advances and Innovations in Engineering (ICRAIE), 2014</em>. The project was further enhanced by integrating it with a web layer and establishing a connection between Arduino and server using serial communication.
  link:

