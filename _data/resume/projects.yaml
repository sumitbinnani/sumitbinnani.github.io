  highlights: "The aim of the project was to develop query engine to filter data from daily feed satisfying any given combination of rules (geospatial: latlonradius, sitedomain, keywords, postal codes, etc.). Since the aim was fast retrieval of records satisfying predefined conditions, I implemented data structures, which despite higher insertion and deletion cost, were fast when it came to retrieval. Storing this data structure in memory of individual mappers, and using Hadoop streaming API, the platform is capable of handling complex queries. Also, the current code can be easily scaled to define new rules owing to the modular code which is built upon design patterns like <em>Factory Pattern</em>, <em>Command Pattern</em>, and <em>Chain of Responsibility</em>. For the ease of usage, I also added an UI on top of the platform for configuring rules. The platform now powers insights which previously were quite difficult to obtain."
