<!DOCTYPE html>
<html>
<head>
    <title>Locate Demo</title>
    <link rel="stylesheet" href="http://cdn.leafletjs.com/leaflet/v0.7.7/leaflet.css" />
    <script src="http://cdn.leafletjs.com/leaflet/v0.7.7/leaflet.js"></script>
    <style>
        #map { width: 100%px; height: 800px; }
        body { font: 16px/1.4 "Helvetica Neue", Arial, sans-serif; }
        .ghbtns { position: relative; top: 4px; margin-left: 5px; }
        a { color: #0077ff; }
    </style>
</head>
<body>
<h1>Heatmap</h1>

Impression File: <input id='inputFile' type='file'>
<input id='loadData' type='submit' value='Load File' onclick='loadFile(this)'>
<span id='loadingFile'></span><br/><br/>
Marker File: <input id='inputMarkers' type='file'>
<input id='loadMarkers' type='submit' value='Load Markers' onclick='loadMarkers(this)'>
<span id='loadingMarkers'></span><br/><br/>
<input id='radius' type='text' placeholder="Radius (default 1)">
<input id='blur' type='text' placeholder="Blur (default 1)">
<input type='submit' value="Refresh" onclick='refreshMap()'> &nbsp; &nbsp; &nbsp;
<input type='submit' value="Capture" onclick='capture(this)'>
<span id='loading' hidden>Preparing Image for Download...</span>
<br/><br/>

<div id="map"></div>

<script src="leaflet-heat.js"></script>
<script src='http://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-image/v0.0.4/leaflet-image.js'></script>
<script src="papaparse.min.js"></script>
<!--<script src="test.js"></script>-->

<script>

	var map = L.map('map');
	var heat;
	var addressPoints =[];
	var myIcon = L.icon({
    iconUrl: 'my_icon.png',
    iconSize: [38, 38],
    iconAnchor: [38, 19]
});


	var tiles = L.tileLayer('http://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png', {
		attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors',
	}).addTo(map);
	
	function loadFile(dom){
		document.getElementById('loadingFile').innerHTML = 'Loading data into memory...';
		dom.disabled = true;
		file = document.getElementById('inputFile').files[0];
		config = {};
		config.header = true;
		config.dynamicTyping = true;
		/*config.preview = 3;
		config.step = function(results, parser) {
						console.log("Row data:", results.data[0]['X'])
					};	*/
		config.skipEmptyLines = true,
		config.complete =  function(results, file) {
							addressPoints = results.data.map(function (p) { return [p['Y'], p['X']]; });
							Xsum = 0;
							Ysum = 0;
							length = addressPoints.length;	
							addressPoints.forEach(function(d){Xsum=Xsum+d[0]; Ysum=Ysum+d[1]});
							map.setView([Xsum/length,Ysum/length],11);
							heat = L.heatLayer(addressPoints, {radius:5}).addTo(map);
							heat.setOptions({radius:1, blur:1});
							document.getElementById('loadingFile').innerHTML = 'Loading Complete.';
							dom.disabled = false;
						};
		Papa.parse(file, config);
	}
	
	function loadMarkers(dom){
		document.getElementById('loadingMarkers').innerHTML = 'Loading markers...';
		dom.disabled = true;
		file = document.getElementById('inputMarkers').files[0];
		config = {};
		config.header = true;
		config.dynamicTyping = true;
		/*config.preview = 3;
		config.step = function(results, parser) {
						console.log("Row data:", results.data[0]['X'])
					};	*/
		config.skipEmptyLines = true,
		config.complete =  function(results, file) {
							markerPoints = results.data.map(function (p) { return [p['Y'], p['X'], p['Name']]; });
							markerPoints.forEach(function(p){
								//L.marker([p[0], p[1]], {icon: myIcon, title: p[2]}).addTo(map);
								L.marker([p[0], p[1]], {title: p[2]}).addTo(map);
							});
							document.getElementById('loadingMarkers').innerHTML = 'Loading Complete.';
							dom.disabled = false;
						};
		Papa.parse(file, config);
	}
	
	
	
	
	function capture(dom){
		dom.disabled = true;
		document.getElementById('loading').hidden = false;
		var canvas = document.createElement('canvas');
		var context;
		var image1 = new Image();
		var image2 = new Image();
		var mergedImage = new Image();
		leafletImage(map, function(err, canvas) {
			dataURL=canvas.toDataURL('image/png');
			image1.src = dataURL;
			
			canvas.width = image1.width;
			canvas.height = image1.height;
			context = canvas.getContext("2d");
			
			heatLayer = document.getElementsByTagName('canvas')[0];
			image2.src = heatLayer.toDataURL('image/png');
			
			context.drawImage(image1, 0, 0);
			context.drawImage(image2, 0, 0);
			mergedImage.src = canvas.toDataURL('image/png');
			
			document.getElementById('loading').hidden = true;
			dom.disabled = false;
			
			var a = document.createElement('a');
			a.download = 'heatmap.png';
			a.href = mergedImage.src;
			a.click();
		});
	}
	
	function refreshMap(){
		r = document.getElementById('radius').value;
		b = document.getElementById('blur').value;
		r = r==""?1:r;
		b = b==""?1:b;
		options = {};
		options.radius=Number(r);
		options.blur=Number(b);
		heat.setOptions(options);
	}

</script>
</body>
</html>
